# Keeps dependencies patched without anyone having to remember.
#
# Security advisories are what this is really for: the project had vulnerable
# packages for months before anyone noticed. Dependabot opens a PR, CI runs the
# security suite against it, and the PR is only mergeable if that passes.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Accra
    # Enough to stay current without burying the review queue
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
    groups:
      # Patch and minor bumps travel together; majors come one at a time so a
      # breaking change is easy to attribute and revert.
      routine:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Prisma majors change the client API and the migration workflow — these
      # get upgraded deliberately, following the upgrade guide.
      - dependency-name: prisma
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
    commit-message:
      prefix: "ci"
