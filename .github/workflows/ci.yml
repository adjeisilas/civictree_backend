name: CI

# Runs on every pull request and every push to main.
# Make these checks required in GitHub: Settings -> Branches -> Branch protection rules.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-tests:
    name: Security tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: civictree_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptestpass"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      # Throwaway database: the suite refuses to run against anything else
      TEST_DATABASE_URL: mysql://root:testpass@127.0.0.1:3306/civictree_test
      DATABASE_URL: mysql://root:testpass@127.0.0.1:3306/civictree_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Applies prisma/migrations from empty, so a broken or missing migration
      # fails here rather than during a production release
      - name: Apply migrations to the test schema
        run: npx prisma migrate deploy

      - name: Run security tests
        run: npm run test:security

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails the build on high or critical advisories in production dependencies
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/

      # Looks for credentials in the code and in the commit history
      - name: Scan for committed secrets
        run: gitleaks detect --redact --no-banner --config .gitleaks.toml
